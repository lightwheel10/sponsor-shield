<!doctype html><meta charset="utf-8"><title>promo small</title>
<link rel="stylesheet" href="../../content.css">
<style>
html,body{margin:0;width:440px;height:280px;overflow:hidden;background:#141418;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{position:relative;width:440px;height:280px}
.brand{position:absolute;left:24px;top:22px;display:flex;align-items:center;gap:9px;color:#f4f4f6;font-weight:650;font-size:17px;letter-spacing:-.01em}
.brand img{width:26px;height:26px;border-radius:7px}
.head{position:absolute;left:24px;top:66px;width:170px;color:#f4f4f6;font-size:25px;line-height:1.12;font-weight:650;letter-spacing:-.02em}
.head em{font-style:normal;color:#ffb224}
/* mini player, right side, bleeding off the edge */
#movie_player{position:absolute!important;left:212px;top:40px;width:270px;height:200px;border-radius:14px;overflow:hidden;background:#0b0b0e;box-shadow:0 18px 40px rgba(0,0,0,.5)}
#movie_player img.v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(14px) saturate(.7) brightness(.7);transform:scale(1.1)}
#movie_player .ytss-overlay{animation:none;padding:0 0 26px 0;place-items:center start;padding-left:16px}
#movie_player .ytss-card{animation:none;width:176px;padding:12px 13px 11px;border-radius:13px}
#movie_player .ytss-count{font-size:30px;margin:7px 0 2px}
#movie_player .ytss-caption{font-size:10.5px}
#movie_player .ytss-track{margin:9px 0 10px}
#movie_player .ytss-eyebrow{font-size:9.5px}
#movie_player .ytss-button{padding:6px 11px;font-size:11px}
#movie_player .ytss-source{display:none}
.bar{position:absolute;left:14px;right:14px;bottom:14px;height:3px;background:rgba(255,255,255,.25);border-radius:2px;z-index:40}
.bar i{position:absolute;top:0;bottom:0;border-radius:2px}
</style>
<div class="wrap">
  <div class="brand"><img src="../../icons/shield-128.png" alt="">Sponsor Shield</div>
  <div class="head">Sponsors, <em>muted</em> and <em>blurred</em>.</div>
  <div id="movie_player">
    <img class="v" src="artwork.svg" alt="">
    <div class="ytss-overlay"><div class="ytss-card"><div class="ytss-head"><span class="ytss-icon"></span><span class="ytss-eyebrow">Sponsor segment</span></div>
      <div class="ytss-count">0:24</div><div class="ytss-caption">Sound and picture return when it ends</div>
      <div class="ytss-track"><div class="ytss-fill" style="--ytss-progress:.42"></div></div>
      <div class="ytss-foot"><button class="ytss-button" type="button">Show anyway</button></div></div></div>
    <div class="bar"><i style="left:0;width:34%;background:#fff"></i><i style="left:24%;width:16%;background:#ffb224"></i><i style="left:70%;width:12%;background:#ffb224"></i></div>
  </div>
</div>
