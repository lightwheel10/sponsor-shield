# nginx site for the Sponsor Shield server.
# Install: /etc/nginx/sites-available/sponsor-shield (then link into sites-enabled)
# HTTPS certificate: certbot --nginx -d sponsor-shield.spectrumailabs.com

# First wall against floods, before requests even reach the Python server.
# (These two lines must sit at the http level; a file in sites-enabled is.)
limit_req_zone $binary_remote_addr zone=shield_lookup:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=shield_submit:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=shield_conn:10m;

server {
    listen 80;
    server_name sponsor-shield.spectrumailabs.com;

    # Nothing but the two API routes and the health check is served.
    location / { return 404; }

    limit_conn shield_conn 10;
    limit_req_status 429;
    client_body_timeout 15s;
    client_header_timeout 10s;
    server_tokens off;
    # The privacy policy promises logs without IP addresses; nginx would log them by default.
    access_log off;
    # Rate-limit rejections are logged with the client's IP at "error" level; keep only critical problems.
    error_log /var/log/nginx/sponsor-shield-error.log crit;

    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
    }

    # The extension's privacy policy, a single static page (copied from store/privacy.html).
    location = /privacy {
        alias /opt/sponsor-shield/privacy.html;
        default_type "text/html; charset=utf-8";
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location /v1/segments/ {
        limit_except GET { deny all; }
        limit_req zone=shield_lookup burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    location = /v1/transcripts {
        limit_except POST { deny all; }
        limit_req zone=shield_submit burst=5 nodelay;
        # A 6-hour transcript is about 1 MB; the server refuses anything over 2 MB too.
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }
}
